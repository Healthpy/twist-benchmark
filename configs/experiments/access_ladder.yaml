explainer_seeds:
- 501
n_factuals: 50
target: 1
jobs: 3
certificates: 1
budget:
  max_queries: 200000
  time_limit_s: 120
  max_reference: 500
evaluation:
  readings:
  - first_change_atomic
  compute_dtw: false
  constraints:
