# Native high-level control: u_drive over 4 steps through the world's control interface (R6-style
# action model; the oracle mechanism is still needed for the Pearl rollout).
name: PearlSCMRecourse
seed: 506
regime: R6
params: {action_form: control, control: u_drive, duration: 4, t0_fracs: [0.5, 0.75], steps: 200,
         lambda_pred: 1.0, lambda_prox: 0.1, lr: 0.05}
