[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "twist-benchmark"
version = "0.1.0"
description = "TWIST: Temporal World-relative Intervention, Simulation, and Traceability benchmark for counterfactual explanations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "torch>=2.2",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

# third-party baselines (cfts, MIT), pinned to the commit the adapters were written against
baselines = [
    "counterfactuals-for-time-series @ git+https://github.com/visual-xai-for-time-series/counterfactual-explanations-for-time-series@86c9e6e2ba3e894a3d5288f7a36f5908cea28232",
]

[project.scripts]
twist = "twist.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/twist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "smoke: end-to-end smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["twist"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
